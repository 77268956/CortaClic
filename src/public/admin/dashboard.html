<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Panel de administración de CortaClic.">
  <title>Dashboard – CortaClic Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/panel.css">
</head>
<body class="split-mode">

  <header id="mobile-header" class="mobile-header d-md-none"></header>
  <div id="desktop-nav" class="d-none d-md-block"></div>

  <div class="split-container">
    
    <!-- Top Panel: Calendar -->
    <div class="split-pane split-pane-top" id="split-top">
      
      <div class="cal-header">
        <div class="cal-title-row">
          <h1 class="cal-title" id="cal-title-text">Citas de esta semana</h1>
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="prevWeek()">&#8249;</button>
            <span class="cal-nav-date" id="cal-date-label">Oct 16 – 22</span>
            <button class="cal-nav-btn" onclick="nextWeek()">&#8250;</button>
          </div>
        </div>
        
        <div class="cal-toolbar">
          <div class="cal-tab active" id="tab-week" onclick="setCalMode('week')">Semana (Días)</div>
          <div class="cal-tab" id="tab-day" onclick="setCalMode('day')">Hoy (Barberos)</div>
          
          <div style="width: 1px; background: var(--border); margin: 0 4px;"></div>
          
          <!-- Barbers filter -->
          <select id="barber-filter" class="cc-input" style="padding: 2px 8px; font-size: .8rem; height: auto; min-width: 120px;" onchange="loadCalendar()">
            <option value="all">Todos los barberos</option>
          </select>
        </div>
      </div>

      <div class="sched-wrapper" id="sched-scroll">
        <table class="sched-table">
          <colgroup id="cal-colgroup">
            <col class="col-time">
            <!-- generated by JS -->
          </colgroup>
          <thead>
            <tr id="cal-thead-row">
              <th class="th-time-corner"><i class="fa fa-clock-o"></i></th>
              <!-- generated by JS -->
            </tr>
          </thead>
          <tbody id="cal-tbody">
            <!-- generated by JS -->
          </tbody>
        </table>
      </div>

    </div>

    <!-- Draggable Resizer -->
    <div class="split-resizer" id="split-resizer"></div>

    <!-- Bottom Panel: Agenda & Walk-ins -->
    <div class="split-pane split-pane-bottom" id="split-bottom">
      
      <div class="agenda-header d-flex flex-column align-items-stretch" style="gap:12px;">
        <div class="d-flex justify-content-between align-items-center w-100">
          <h2 class="cal-title">Agenda Hoy</h2>
          <button class="btn-ghost" style="padding: 4px 10px; font-size: .8rem;" onclick="loadAgenda()">
            <i class="fa fa-refresh"></i>
          </button>
        </div>
        <input type="text" id="agenda-search" class="cc-input" placeholder="Buscar cliente o barbero..." onkeyup="renderAgenda()" style="font-size:.85rem; padding:6px 12px; height:auto;">
        <div class="cal-toolbar" style="padding-bottom:0;" id="agenda-filters">
          <div class="cal-tab active" data-filter="activas" onclick="setAgendaFilter('activas')">Activas</div>
          <div class="cal-tab" data-filter="all" onclick="setAgendaFilter('all')">Todas</div>
          <div class="cal-tab" data-filter="0" onclick="setAgendaFilter(0)">Pendientes</div>
          <div class="cal-tab" data-filter="1" onclick="setAgendaFilter(1)">Confirmadas</div>
          <div class="cal-tab" data-filter="3" onclick="setAgendaFilter(3)">Completadas</div>
          <div class="cal-tab" data-filter="2" onclick="setAgendaFilter(2)">Canceladas</div>
        </div>
      </div>

      <div class="agenda-list" id="agenda-list">
        <div class="text-center py-4 text-muted" style="font-size: .85rem;">Cargando agenda...</div>
      </div>

      <!-- Quick Add (Walk-in) Button -->
      <button class="fab-btn" onclick="openWalkinModal()">
        <i class="fa fa-plus"></i>
      </button>

    </div>
  </div>

  <nav id="bottom-nav" class="bottom-nav d-md-none"></nav>

  <!-- Walk-in Modal -->
  <div class="modal fade" id="walkinModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background: var(--surface); border: 1px solid var(--border); color: var(--text-1);">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" style="font-family:'Outfit',sans-serif; font-weight:700;">Nueva Cita Rápida</h5>
          <button type="button" class="close text-white" data-dismiss="modal"><i class="fa fa-times"></i></button>
        </div>
        <div class="modal-body">
          <form id="form-walkin">
            <div class="mb-3">
              <label class="cc-label">Nombre del Cliente</label>
              <input type="text" id="walkin-cliente" class="cc-input" placeholder="Ej. Carlos Mendoza" required>
            </div>
            <div class="mb-3">
              <label class="cc-label">Servicio</label>
              <select id="walkin-servicio" class="cc-input" required></select>
            </div>
            <div class="mb-3">
              <label class="cc-label">Barbero</label>
              <select id="walkin-barbero" class="cc-input" required></select>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="cc-label">Hora Inicio</label>
                <select id="walkin-hora" class="cc-input" required>
                  <option value="">Cargando...</option>
                </select>
              </div>
              <div class="col-6 mb-3">
                <label class="cc-label">Fecha</label>
                <input type="date" id="walkin-fecha" class="cc-input" required>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn-ghost" data-dismiss="modal">Cancelar</button>
          <button type="button" class="btn-accent" onclick="saveWalkin()">Guardar Cita</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Gestor Cita Modal -->
  <div class="modal fade" id="gestorCitaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background: var(--surface); border: 1px solid var(--border); color: var(--text-1);">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" style="font-family:'Outfit',sans-serif; font-weight:700;">Gestionar Cita</h5>
          <button type="button" class="close text-white" data-dismiss="modal"><i class="fa fa-times"></i></button>
        </div>
        <div class="modal-body pt-3">
          <p id="gestor-cita-info" class="mb-4 text-muted"></p>
          <input type="hidden" id="gestor-cita-id">
          
          <label class="cc-label mb-2">Acciones Rápidas</label>
          <div class="d-flex flex-column gap-2" style="gap:10px;" id="gestor-actions">
            <!-- generated by JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/site.js"></script>
  <script src="/js/split-view.js"></script>
  
  <script>
    CC.requireAuth([0]);

    // Calendar State
    let calMode = 'week'; // 'week' | 'day'
    let currentDate = new Date();
    
    // Data Caches
    let barberos = [];
    let servicios = [];
    let citasData = []; // Raw citas from API for Calendar
    let agendaData = []; // Raw citas from API for Agenda
    let currentAgendaFilter = 'activas';

    document.addEventListener('DOMContentLoaded', async () => {
      // Fix specific heights for mobile Safari
      if(window.innerHeight < 800) {
        document.querySelector('.split-container').style.height = (window.innerHeight - 60) + 'px';
      }
      
      // Load initial lists
      await Promise.all([
        fetchBarberos(),
        fetchServicios()
      ]);
      
      // Set today for walk-in form
      document.getElementById('walkin-fecha').value = currentDate.toISOString().split('T')[0];

      // Initial renders
      setCalMode('week'); // triggers loadCalendar
      loadAgenda();

      // Walkin event listeners
      document.getElementById('walkin-barbero').addEventListener('change', loadWalkinAvailability);
      document.getElementById('walkin-servicio').addEventListener('change', loadWalkinAvailability);
      document.getElementById('walkin-fecha').addEventListener('change', loadWalkinAvailability);
    });

    async function fetchBarberos() {
      try {
        const res = await fetch('/api/admin/barberos', { headers: { Authorization: `Bearer ${CC.getToken()}` } });
        const data = await res.json();
        if (data.ok) {
          barberos = data.barberos;
          const selectFilter = document.getElementById('barber-filter');
          const selectWalkin = document.getElementById('walkin-barbero');
          
          barberos.forEach(b => {
            selectFilter.innerHTML += `<option value="${b.id}">${b.nombre}</option>`;
            selectWalkin.innerHTML += `<option value="${b.id}">${b.nombre}</option>`;
          });
        }
      } catch (e) { console.error('Error barberos:', e); }
    }

    async function fetchServicios() {
      try {
        const res = await fetch('/api/admin/servicios', { headers: { Authorization: `Bearer ${CC.getToken()}` } });
        const data = await res.json();
        if (data.ok) {
          servicios = data.servicios;
          const selectWalkin = document.getElementById('walkin-servicio');
          servicios.forEach(s => {
            selectWalkin.innerHTML += `<option value="${s.id}">${s.nombre} ($${s.precio})</option>`;
          });
        }
      } catch (e) { console.error('Error servicios:', e); }
    }

    // --- Panel Interactions ---
    function setCalMode(mode) {
      calMode = mode;
      document.getElementById('tab-week').classList.toggle('active', mode === 'week');
      document.getElementById('tab-day').classList.toggle('active', mode === 'day');
      
      const title = mode === 'week' ? 'Citas de esta semana' : 'Citas por Barbero (Hoy)';
      document.getElementById('cal-title-text').textContent = title;
      
      loadCalendar();
    }

    function getStartOfWeek(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Monday as first
      return new Date(d.setDate(diff));
    }

    async function loadCalendar() {
      // 1. Determine Date Range
      let startDate, endDate;
      if (calMode === 'week') {
        startDate = getStartOfWeek(currentDate);
        endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 6);
        
        const fMonth = startDate.toLocaleDateString('es-ES', { month: 'short' });
        document.getElementById('cal-date-label').textContent = 
          `${startDate.getDate()} - ${endDate.getDate()} ${fMonth}`;
      } else {
        startDate = new Date(currentDate);
        endDate = new Date(currentDate);
        
        document.getElementById('cal-date-label').textContent = 
          startDate.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      // 2. Fetch Citas
      const token = CC.getToken();
      const sStr = startDate.toISOString().split('T')[0];
      const eStr = endDate.toISOString().split('T')[0];
      const bFilter = document.getElementById('barber-filter').value;
      
      let url = `/api/admin/historial?desde=${sStr}&hasta=${eStr}`;
      
      try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        if (data.ok) {
          // Si filtramos por barbero localmente en modo semana
          citasData = data.citas;
          if (bFilter !== 'all' && calMode === 'week') {
            citasData = citasData.filter(c => c.barbero_id == bFilter);
          }
          renderCalendarGrid(startDate);
        }
      } catch (err) {
        console.error('Error fetching calendar:', err);
      }
    }

    function renderCalendarGrid(startDate) {
      const colgroup = document.getElementById('cal-colgroup');
      const thead = document.getElementById('cal-thead-row');
      const tbody = document.getElementById('cal-tbody');
      
      // Reset
      colgroup.innerHTML = '<col class="col-time">';
      thead.innerHTML = '<th class="th-time-corner"><i class="fa fa-clock-o"></i></th>';
      let rowsHtml = '';
      
      const HOURS = Array.from({length: 15}, (_, i) => i + 7); // 7am to 9pm

      if (calMode === 'week') {
        // Columns = Days
        const days = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
        
        days.forEach((dName, i) => {
          const d = new Date(startDate);
          d.setDate(d.getDate() + i);
          
          colgroup.innerHTML += '<col class="col-day">';
          const isToday = (d.toDateString() === new Date().toDateString()) ? 'today' : '';
          thead.innerHTML += `
            <th>
              <span class="th-dayname">${dName}</span>
              <span class="th-date ${isToday}">${d.getDate()}</span>
            </th>
          `;
        });

        HOURS.forEach(h => {
          let tr = `<tr data-hour="${h}">
            <td class="time-cell"><span>${h}:00</span></td>`;
          
          for(let i=0; i<7; i++) {
            const d = new Date(startDate);
            d.setDate(d.getDate() + i);
            const isToday = (d.toDateString() === new Date().toDateString()) ? 'today-col' : '';
            tr += `<td class="data-cell ${isToday}" data-day="${i}" data-hour="${h}"></td>`;
          }
          tr += `</tr>`;
          rowsHtml += tr;
        });

      } else {
        // Columns = Barberos
        barberos.forEach(b => {
          colgroup.innerHTML += '<col class="col-day">';
          thead.innerHTML += `
            <th>
              <span class="th-dayname">Barbero</span>
              <span class="th-date" style="font-size:.8rem; border-radius:4px; width:auto; padding:0 8px;">${b.nombre.split(' ')[0]}</span>
            </th>
          `;
        });

        HOURS.forEach(h => {
          let tr = `<tr data-hour="${h}">
            <td class="time-cell"><span>${h}:00</span></td>`;
          
          barberos.forEach(b => {
            tr += `<td class="data-cell" data-barbero="${b.id}" data-hour="${h}"></td>`;
          });
          tr += `</tr>`;
          rowsHtml += tr;
        });
      }

      tbody.innerHTML = rowsHtml;
      
      // Plot Citas
      plotCitas();
      buildNowLine();
    }

    function plotCitas() {
      const cellsMap = new Map();

      citasData.forEach(c => {
        const dt = new Date(c.fecha_hora);
        const h = dt.getHours();
        const m = dt.getMinutes();
        const dayIdx = (dt.getDay() === 0 ? 6 : dt.getDay() - 1); // 0 = Mon
        
        let targetCell;
        if (calMode === 'week') {
          targetCell = document.querySelector(`.data-cell[data-day="${dayIdx}"][data-hour="${h}"]`);
        } else {
          // If we are looking at a specific day, ensure cita is for THIS date
          if (dt.toDateString() === currentDate.toDateString()) {
             targetCell = document.querySelector(`.data-cell[data-barbero="${c.barbero_id || ''}"][data-hour="${h}"]`);
          }
        }

        if (targetCell) {
          if(!cellsMap.has(targetCell)) cellsMap.set(targetCell, []);
          cellsMap.get(targetCell).push({ cita: c, m: m });
        }
      });

      cellsMap.forEach((events, cell) => {
        const count = events.length;
        const widthPct = 100 / count;
        
        events.forEach((evData, idx) => {
          const c = evData.cita;
          const topPct = (evData.m / 60) * 100;
          // Approx 1hr duration (60px)
          const height = 55; 
          const leftPct = widthPct * idx;
          
          const ev = document.createElement('div');
          ev.className = `event-block estado-${c.estado}`;
          ev.style.top = `${topPct}%`;
          ev.style.height = `${height}px`;
          ev.style.width = `calc(${widthPct}% - 4px)`;
          ev.style.left = `calc(${leftPct}% + 2px)`;
          
          const sName = c.servicio_nombre || 'Servicio';
          const uName = c.cliente_nombre || 'Cliente';
          ev.innerHTML = `
            <div class="event-title">${sName}</div>
            <div class="event-meta">${uName}</div>
          `;
          ev.onclick = (e) => {
             e.stopPropagation();
             openGestorCita(c);
          };
          cell.appendChild(ev);
        });
      });
    }

    function buildNowLine() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      
      if (calMode === 'week') {
        const rows = document.querySelectorAll('#cal-tbody tr');
        rows.forEach(row => {
          if (parseInt(row.getAttribute('data-hour')) === h) {
            const pct = (m / 60) * 100;
            const line = document.createElement('div');
            line.className = 'now-line';
            line.style.top = `${pct}%`;
            line.innerHTML = '<div class="now-dot"></div>';
            
            // Append to today's cell
            const todayCell = row.querySelector('.today-col');
            if(todayCell) todayCell.appendChild(line);
          }
        });
      }
    }

    function prevWeek() {
      if(calMode === 'week') currentDate.setDate(currentDate.getDate() - 7);
      else currentDate.setDate(currentDate.getDate() - 1);
      loadCalendar();
    }
    function nextWeek() {
      if(calMode === 'week') currentDate.setDate(currentDate.getDate() + 7);
      else currentDate.setDate(currentDate.getDate() + 1);
      loadCalendar();
    }

    // --- Bottom Panel Agenda ---
    function setAgendaFilter(filter) {
      currentAgendaFilter = filter;
      document.querySelectorAll('#agenda-filters .cal-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`#agenda-filters .cal-tab[data-filter="${filter}"]`).classList.add('active');
      renderAgenda();
    }

    async function loadAgenda() {
      const list = document.getElementById('agenda-list');
      list.innerHTML = '<div class="text-center py-4 text-muted"><span class="btn-spinner"></span></div>';
      
      const token = CC.getToken();
      const todayStr = new Date().toISOString().split('T')[0];
      
      try {
        // Obtenemos historial completo de hoy (sin filtro de estado en BD)
        const res = await fetch(`/api/admin/historial?desde=${todayStr}&hasta=${todayStr}`, { 
          headers: { Authorization: `Bearer ${token}` } 
        });
        const data = await res.json();
        
        if (data.ok) {
          agendaData = data.citas || [];
          renderAgenda();
        } else {
          list.innerHTML = '<div class="text-center py-4 text-muted" style="font-size:.85rem;">Error cargando agenda.</div>';
        }
      } catch (err) {
        list.innerHTML = '<div class="text-center py-4 text-danger">Error cargando agenda</div>';
      }
    }

    function renderAgenda() {
      const list = document.getElementById('agenda-list');
      const searchTerm = (document.getElementById('agenda-search').value || '').toLowerCase();
      
      let filtered = agendaData;
      
      // Filter by status
      if (currentAgendaFilter === 'activas') {
        filtered = filtered.filter(c => c.estado === 0 || c.estado === 1);
      } else if (currentAgendaFilter !== 'all') {
        filtered = filtered.filter(c => c.estado == currentAgendaFilter);
      }
      
      // Filter by search term
      if (searchTerm) {
        filtered = filtered.filter(c => {
          const cli = (c.cliente_nombre || '').toLowerCase();
          const barb = (c.barbero_nombre || '').toLowerCase();
          const serv = (c.servicio_nombre || '').toLowerCase();
          return cli.includes(searchTerm) || barb.includes(searchTerm) || serv.includes(searchTerm);
        });
      }
      
      if (filtered.length === 0) {
        list.innerHTML = '<div class="text-center py-4 text-muted" style="font-size:.85rem;">No se encontraron citas.</div>';
        return;
      }
      
      list.innerHTML = '';
      filtered.forEach(c => {
        const dt = new Date(c.fecha_hora);
        const timeStr = dt.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        
        list.innerHTML += `
          <div class="agenda-item" onclick='openGestorCita(${JSON.stringify(c).replace(/'/g, "\\'")})'>
            <div class="agenda-time">${timeStr}</div>
            <div class="agenda-body">
              <div class="agenda-title">${c.cliente_nombre || 'Sin nombre'}</div>
              <div class="agenda-desc">
                <span style="color:var(--accent)">${c.servicio_nombre || 'Servicio'}</span> 
                · ${c.barbero_nombre || 'Sin barbero'}
              </div>
            </div>
            <div style="flex-shrink:0;">
              ${estadoBadge(c.estado)}
            </div>
          </div>
        `;
      });
    }

    function estadoBadge(est) {
      if (est == 0) return '<span class="sbadge sbadge-pending" style="font-size:.65rem">Pendiente</span>';
      if (est == 1) return '<span class="sbadge sbadge-confirm" style="font-size:.65rem">Confirmada</span>';
      if (est == 2) return '<span class="sbadge sbadge-cancel" style="font-size:.65rem">Cancelada</span>';
      if (est == 3) return '<span class="sbadge sbadge-done" style="font-size:.65rem">Completada</span>';
      return '';
    }

    // --- Walkin Modal ---
    function openWalkinModal() {
      loadWalkinAvailability();
      $('#walkinModal').modal('show');
    }

    async function loadWalkinAvailability() {
      const barbero_id = document.getElementById('walkin-barbero').value;
      const servicio_id = document.getElementById('walkin-servicio').value;
      const fecha = document.getElementById('walkin-fecha').value;
      const horaSelect = document.getElementById('walkin-hora');

      if (!barbero_id || !servicio_id || !fecha) {
        horaSelect.innerHTML = '<option value="">Completa otros campos</option>';
        return;
      }

      horaSelect.innerHTML = '<option value="">Cargando horarios...</option>';
      try {
        const url = `/api/citas/disponibilidad?barbero_id=${barbero_id}&fecha=${fecha}&servicio_id=${servicio_id}`;
        const res = await fetch(url);
        const data = await res.json();
        
        horaSelect.innerHTML = '';
        if (data.ok && Array.isArray(data.slots) && data.slots.length > 0) {
          let hasAvailable = false;
          data.slots.forEach(s => {
            if (s.disponible) {
              horaSelect.innerHTML += `<option value="${s.hora}">${s.hora}</option>`;
              hasAvailable = true;
            }
          });
          if (!hasAvailable) {
            horaSelect.innerHTML = '<option value="">Sin disponibilidad</option>';
          }
        } else {
          horaSelect.innerHTML = '<option value="">Sin disponibilidad</option>';
        }
      } catch(err) {
        horaSelect.innerHTML = '<option value="">Error al cargar</option>';
      }
    }

    async function saveWalkin() {
      const cliente_nombre = document.getElementById('walkin-cliente').value;
      const servicio_id = document.getElementById('walkin-servicio').value;
      const barbero_id = document.getElementById('walkin-barbero').value;
      const hora = document.getElementById('walkin-hora').value;
      const fecha = document.getElementById('walkin-fecha').value;

      if(!cliente_nombre || !hora || !fecha) return Swal.fire({ icon: 'warning', title: 'Faltan datos', text: 'Completa los datos requeridos', background: 'var(--surface)', color: 'var(--text-1)' });

      const fecha_hora = `${fecha} ${hora}:00`;

      try {
        const res = await fetch('/api/admin/citas/walkin', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CC.getToken()}`
          },
          body: JSON.stringify({ cliente_nombre, servicio_id, barbero_id, fecha_hora })
        });
        const data = await res.json();
        
        if (data.ok) {
          $('#walkinModal').modal('hide');
          document.getElementById('form-walkin').reset();
          loadAgenda();
          loadCalendar();
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: data.message || 'Error', background: 'var(--surface)', color: 'var(--text-1)' });
        }
      } catch (err) {
        console.error('Error walkin:', err);
      }
    }

    // --- Gestor Modal ---
    function openGestorCita(cita) {
      document.getElementById('gestor-cita-id').value = cita.id;
      const d = new Date(cita.fecha_hora).toLocaleString('es-ES', { dateStyle:'short', timeStyle:'short' });
      document.getElementById('gestor-cita-info').innerHTML = `
        <strong>Cliente:</strong> ${cita.cliente_nombre}<br>
        <strong>Servicio:</strong> ${cita.servicio_nombre}<br>
        <strong>Barbero:</strong> ${cita.barbero_nombre}<br>
        <strong>Fecha/Hora:</strong> ${d}<br>
        <strong>Estado actual:</strong> ${estadoBadge(cita.estado)}
      `;

      const actionsCont = document.getElementById('gestor-actions');
      actionsCont.innerHTML = '';
      
      if (cita.estado === 0) {
        actionsCont.innerHTML += `<button class="btn btn-outline-info" onclick="updateCitaStatus(1)">Atender / Confirmar</button>`;
        actionsCont.innerHTML += `<button class="btn btn-outline-success" onclick="updateCitaStatus(3)">Marcar como Completada</button>`;
        actionsCont.innerHTML += `<button class="btn btn-outline-danger" onclick="updateCitaStatus(2)">Cancelar Cita</button>`;
      } else if (cita.estado === 1) {
        actionsCont.innerHTML += `<button class="btn btn-outline-success" onclick="updateCitaStatus(3)">Marcar como Completada</button>`;
        actionsCont.innerHTML += `<button class="btn btn-outline-danger" onclick="updateCitaStatus(2)">Cancelar Cita</button>`;
      } else {
        // Cancelled or Completed
        actionsCont.innerHTML += `<button class="btn btn-outline-secondary" onclick="updateCitaStatus(0)">Reabrir Cita (Pendiente)</button>`;
      }

      $('#gestorCitaModal').modal('show');
    }

    async function updateCitaStatus(nuevoEstado) {

  // 1. Recuperamos el ID de la cita que el modal guardó en el input hidden

  const citaId = document.getElementById('gestor-cita-id').value;

  const token = CC.getToken(); // O el método que uses para recuperar tu token de autenticación

  try {

    // 2. Tu llamada FETCH actual que actualiza el estado en el backend

    const res = await fetch(`/api/citas/${citaId}/status`, { // Ajusta la URL a tu ruta exacta de Express

      method: 'PATCH', // o PUT según uses en tus rutas

      headers: {

        'Content-Type': 'application/json',

        'Authorization': `Bearer ${token}`

      },

      body: JSON.stringify({ estado: nuevoEstado })

    });



    const data = await res.json();



    if (data.ok) {

      

      // 3. Tu lógica actual para cerrar modal y refrescar la pantalla

      $('#gestorCitaModal').modal('hide');

      

      // Llamas a tus funciones actuales para refrescar el dashboard

      if (typeof loadCalendar === 'function') loadCalendar();

      if (typeof loadAgenda === 'function') loadAgenda();



      Swal.fire({

        icon: 'success',

        title: nuevoEstado === 3 ? '¡Servicio Completado!' : 'Estado Actualizado',

        text: nuevoEstado === 3 ? 'El ticket ha sido generado correctamente.' : 'La cita ha cambiado de estado.',

        timer: 2000,

        showConfirmButton: false

      });



    } else {

      Swal.fire('Error', data.message || 'No se pudo actualizar la cita', 'error');

    }

  } catch (err) {

    console.error('[updateCitaStatus]', err);

    Swal.fire('Error', 'Error de red al actualizar la cita', 'error');

  }

} 

  </script>
