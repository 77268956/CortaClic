<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestionar productos de la tienda – CortaClic Admin.">
  <title>Productos – CortaClic Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <header id="mobile-header" class="mobile-header d-md-none"></header>
  <div id="desktop-nav" class="d-none d-md-block"></div>

  <main class="page-container fade-up">

    <div class="admin-page-header">
      <div>
        <p class="page-hero__tag"><i class="fa fa-archive mr-1"></i>Tienda</p>
        <h1 class="page-hero__title">Productos</h1>
      </div>
      <button class="btn-accent" onclick="openProdModal()">
        <i class="fa fa-plus"></i> Nuevo
      </button>
    </div>

    <div class="cc-alert mb-3" id="prod-alert"></div>

    <!-- Loading -->
    <div id="loading-prods" class="text-center py-4">
      <span class="btn-spinner mb-2" style="width:28px;height:28px;border-width:3px;"></span>
      <p style="font-size:.85rem;color:var(--text-3);">Cargando productos...</p>
    </div>

    <!-- Grid list -->
    <div id="prods-list" class="row" style="display:none; margin:0 -6px;"></div>

    <!-- Empty -->
    <div class="empty-state d-none" id="empty-prods">
      <i class="fa fa-times-circle d-block"></i>
      <h3>Sin productos</h3>
      <p>Aún no hay productos en la tienda. ¡Agrega el primero!</p>
      <button class="btn-accent" onclick="openProdModal()"><i class="fa fa-plus"></i> Agregar producto</button>
    </div>

  </main>

  <nav id="bottom-nav" class="bottom-nav d-md-none"></nav>

  <!-- ══ Modal Producto ══ -->
  <div class="modal fade" id="prodModal" tabindex="-1" data-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title font-weight-bold" id="prod-modal-title">Nuevo Producto</h5>
          <button type="button" class="close" data-dismiss="modal"><i class="fa fa-times"></i></button>
        </div>
        <div class="modal-body">

          <div class="cc-alert mb-3" id="prod-form-alert"></div>
          <input type="hidden" id="prod-id">

          <!-- Image Preview -->
          <div class="admin-img-preview-wrap mb-3">
            <div class="admin-img-preview" id="prod-img-preview">
              <img src="/img/default-service.svg" id="prod-img-preview-el" alt="preview" onerror="this.src='/img/default-service.svg'">
            </div>
            <div class="admin-img-actions">
              <div class="cc-group mb-0">
                <label class="cc-label">URL de imagen</label>
                <div class="cc-input-icon">
                  <i class="fa fa-link-45deg"></i>
                  <input type="url" id="prod-imagen" class="cc-input" placeholder="https://..." oninput="previewProd(this.value)">
                </div>
              </div>
            </div>
          </div>

          <!-- Name & Category -->
          <div class="row">
            <div class="col-md-7">
              <div class="cc-group">
                <label class="cc-label">Nombre del producto *</label>
                <div class="cc-input-icon">
                  <i class="fa fa-archive"></i>
                  <input type="text" id="prod-nombre" class="cc-input" placeholder="Ej: Pomada Matt Effect">
                </div>
              </div>
            </div>
            <div class="col-md-5">
              <div class="cc-group">
                <label class="cc-label">Categoría</label>
                <div class="cc-input-icon">
                  <i class="fa fa-tag"></i>
                  <input type="text" id="prod-categoria" class="cc-input" placeholder="Ej: Pomadas">
                </div>
              </div>
            </div>
          </div>

          <!-- Description -->
          <div class="cc-group">
            <label class="cc-label">Descripción</label>
            <textarea id="prod-descripcion" class="cc-input" rows="3"
              placeholder="Describe brevemente el producto..."
              style="resize:none; height:auto; padding-top:12px; padding-bottom:12px;"></textarea>
          </div>

          <!-- Price & Stock -->
          <div class="row">
            <div class="col-6">
              <div class="cc-group">
                <label class="cc-label">Precio (USD) *</label>
                <div class="cc-input-icon">
                  <i class="fa fa-currency-dollar"></i>
                  <input type="number" id="prod-precio" class="cc-input" placeholder="0.00" min="0" step="0.01">
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="cc-group">
                <label class="cc-label">Stock *</label>
                <div class="cc-input-icon">
                  <i class="fa fa-layers"></i>
                  <input type="number" id="prod-stock" class="cc-input" placeholder="0" min="0">
                </div>
              </div>
            </div>
          </div>

          <!-- Active -->
          <div class="cc-group">
            <label class="cc-label">Estado</label>
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="prod-activo" checked>
                <span class="toggle-thumb"></span>
              </label>
              <span id="prod-activo-label" style="font-size:.88rem; color:var(--text-2);">Producto Activo</span>
            </div>
          </div>

        </div>
        <div class="modal-footer border-0">
          <button class="btn-ghost mr-2" data-dismiss="modal">Cancelar</button>
          <button class="btn-accent" id="btn-save-prod" onclick="saveProduct()">
            <i class="fa fa-check-lg"></i> Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div class="modal fade" id="deleteProdModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content text-center">
        <div class="modal-body" style="padding:32px 20px;">
          <div style="font-size:2.5rem; margin-bottom:12px;">⚠️</div>
          <h5 style="font-family:'Outfit',sans-serif; font-weight:700; margin-bottom:8px;">¿Eliminar producto?</h5>
          <p style="font-size:.85rem; color:var(--text-3); margin-bottom:20px;">Esta acción no se puede deshacer.</p>
          <input type="hidden" id="delete-prod-id">
          <div class="d-flex justify-content-center" style="gap:10px;">
            <button class="btn-ghost" data-dismiss="modal">Cancelar</button>
            <button class="btn-danger-ghost" onclick="confirmDeleteProduct()">
              <i class="fa fa-trash mr-1"></i>Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/site.js"></script>
  <script>
    CC.requireAuth([0]);

    let editingId = null;

    document.getElementById('prod-activo').addEventListener('change', function () {
      document.getElementById('prod-activo-label').textContent =
        this.checked ? 'Producto Activo' : 'Producto Inactivo';
    });

    document.addEventListener('DOMContentLoaded', loadProducts);

    function previewProd(url) {
      document.getElementById('prod-img-preview-el').src = url || '/img/default-service.svg';
    }

    /* ── Load ───────────────────────────────────────── */
    async function loadProducts() {
      const loader  = document.getElementById('loading-prods');
      const listEl  = document.getElementById('prods-list');
      const emptyEl = document.getElementById('empty-prods');

      loader.style.display = 'block';
      listEl.style.display = 'none';
      emptyEl.classList.add('d-none');

      try {
        const token = CC.getToken();
        const res = await fetch('/api/admin/productos', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();

        loader.style.display = 'none';

        if (data.ok && data.productos.length > 0) {
          renderProducts(data.productos);
          listEl.style.display = 'flex';
        } else {
          emptyEl.classList.remove('d-none');
        }
      } catch (e) {
        loader.style.display = 'none';
        emptyEl.classList.remove('d-none');
      }
    }

    function renderProducts(list) {
      const listEl = document.getElementById('prods-list');
      listEl.innerHTML = list.map(p => {
        const img = p.imagen || '/img/default-service.svg';
        const stock = parseInt(p.stock) || 0;
        const stockBadge = stock === 0
          ? '<span class="sbadge sbadge-cancel">Sin stock</span>'
          : stock <= 5
            ? `<span class="sbadge sbadge-pending">Stock: ${stock}</span>`
            : `<span class="sbadge sbadge-confirm">Stock: ${stock}</span>`;

        return `
          <div class="col-12 col-md-6 col-lg-4 px-2 mb-3">
            <div class="admin-svc-card">
              <div class="admin-svc-card__img">
                <img src="${esc(img)}" alt="${esc(p.nombre)}"
                     onerror="this.onerror=null;this.src='/img/default-service.svg';">
                ${!p.activo ? '<span class="admin-badge-inactive">Inactivo</span>' : ''}
              </div>
              <div class="admin-svc-card__body">
                <div class="admin-svc-card__name">${esc(p.nombre)}</div>
                <div class="admin-svc-card__meta">
                  <span class="text-warning font-weight-bold">$${parseFloat(p.precio).toFixed(2)}</span>
                  ${p.categoria ? `<span style="color:var(--text-3);">· ${esc(p.categoria)}</span>` : ''}
                </div>
                <div class="mb-2">${stockBadge}</div>
                <div class="admin-svc-card__desc">${esc(p.descripcion || '—')}</div>
                <div class="admin-svc-card__actions">
                  <button class="btn-ghost" style="flex:1; padding:8px; font-size:.8rem;" onclick="editProduct(${p.id})">
                    <i class="fa fa-pencil mr-1"></i>Editar
                  </button>
                  <button class="btn-danger-ghost ml-1" style="padding:8px 12px;" onclick="promptDeleteProduct(${p.id})">
                    <i class="fa fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ── Open Modal ─────────────────────────────────── */
    function openProdModal(data = null) {
      CC.hideAlert('prod-form-alert');
      editingId = data ? data.id : null;
      document.getElementById('prod-modal-title').textContent  = data ? 'Editar Producto' : 'Nuevo Producto';
      document.getElementById('prod-id').value                 = data ? data.id : '';
      document.getElementById('prod-nombre').value             = data ? data.nombre : '';
      document.getElementById('prod-categoria').value          = data ? (data.categoria || '') : '';
      document.getElementById('prod-descripcion').value        = data ? (data.descripcion || '') : '';
      document.getElementById('prod-imagen').value             = data ? (data.imagen || '') : '';
      document.getElementById('prod-precio').value             = data ? data.precio : '';
      document.getElementById('prod-stock').value              = data ? data.stock : '';
      document.getElementById('prod-activo').checked           = data ? !!data.activo : true;
      document.getElementById('prod-activo-label').textContent = data && !data.activo ? 'Producto Inactivo' : 'Producto Activo';
      previewProd(data ? data.imagen : null);
      $('#prodModal').modal('show');
    }

    /* ── Edit ───────────────────────────────────────── */
    async function editProduct(id) {
      try {
        const token = CC.getToken();
        const res = await fetch(`/api/admin/productos/${id}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.ok) openProdModal(data.producto);
      } catch (e) {
        CC.showAlert('prod-alert', 'Error al cargar el producto.', 'err');
      }
    }

    /* ── Save ───────────────────────────────────────── */
    async function saveProduct() {
      const id          = document.getElementById('prod-id').value;
      const nombre      = document.getElementById('prod-nombre').value.trim();
      const categoria   = document.getElementById('prod-categoria').value.trim();
      const descripcion = document.getElementById('prod-descripcion').value.trim();
      const imagen      = document.getElementById('prod-imagen').value.trim();
      const precio      = parseFloat(document.getElementById('prod-precio').value);
      const stock       = parseInt(document.getElementById('prod-stock').value);
      const activo      = document.getElementById('prod-activo').checked;

      if (!nombre)        return CC.showAlert('prod-form-alert', 'El nombre es requerido.', 'err');
      if (isNaN(precio))  return CC.showAlert('prod-form-alert', 'El precio es requerido.', 'err');
      if (isNaN(stock))   return CC.showAlert('prod-form-alert', 'El stock es requerido.', 'err');

      CC.hideAlert('prod-form-alert');
      CC.setLoading('btn-save-prod', true);

      try {
        const token  = CC.getToken();
        const url    = editingId ? `/api/admin/productos/${id}` : '/api/admin/productos';
        const method = editingId ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ nombre, categoria, descripcion, imagen, precio, stock, activo }),
        });
        const data = await res.json();

        if (data.ok) {
          $('#prodModal').modal('hide');
          CC.showAlert('prod-alert', `Producto ${editingId ? 'actualizado' : 'creado'} exitosamente.`, 'ok');
          loadProducts();
        } else {
          CC.showAlert('prod-form-alert', data.message || 'Error al guardar.', 'err');
        }
      } catch (e) {
        CC.showAlert('prod-form-alert', 'Error de conexión.', 'err');
      } finally {
        CC.setLoading('btn-save-prod', false, '<i class="fa fa-check-lg"></i> Guardar');
      }
    }

    /* ── Delete ─────────────────────────────────────── */
    function promptDeleteProduct(id) {
      document.getElementById('delete-prod-id').value = id;
      $('#deleteProdModal').modal('show');
    }

    async function confirmDeleteProduct() {
      const id = document.getElementById('delete-prod-id').value;
      try {
        const token = CC.getToken();
        const res = await fetch(`/api/admin/productos/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        $('#deleteProdModal').modal('hide');
        if (data.ok) {
          CC.showAlert('prod-alert', 'Producto eliminado.', 'ok');
          loadProducts();
        } else {
          CC.showAlert('prod-alert', data.message || 'No se pudo eliminar.', 'err');
        }
      } catch (e) {
        CC.showAlert('prod-alert', 'Error de conexión.', 'err');
        $('#deleteProdModal').modal('hide');
      }
    }

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
