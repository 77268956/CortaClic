<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agenda tu cita de barbería en CortaClic.">
  <title>Agendar Cita – CortaClic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .barber-opt {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .barber-opt:hover { border-color: var(--accent); background: var(--surface-h); }
    .barber-opt.selected { border-color: var(--accent); background: var(--accent-glow); }
    .barber-opt__avatar {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0; overflow: hidden;
      background: var(--surface-h);
    }
    .barber-opt__name { font-family:'Outfit',sans-serif; font-weight:700; font-size:.92rem; }
    .barber-opt__spec { font-size:.75rem; color:var(--text-3); }
    .barber-opt .check {
      margin-left: auto; color: var(--accent); font-size: 1.1rem;
      opacity: 0; transition: opacity .2s;
    }
    .barber-opt.selected .check { opacity: 1; }

    .time-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 14px;
      border-radius: var(--r-full);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: .82rem;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: border-color .2s, background .2s, color .2s;
      margin: 4px;
    }
    .time-slot:hover:not(.disabled) { border-color: var(--accent); color: var(--accent); }
    .time-slot.selected { background: var(--accent); border-color: var(--accent); color: #1a1000; }
    .time-slot.disabled { opacity: .35; cursor: not-allowed; text-decoration: line-through; }

    .day-pill {
      padding: 7px 14px; border-radius: var(--r-full);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-2); font-size: .8rem; font-weight: 600;
      font-family: 'Outfit', sans-serif; cursor: pointer;
      transition: border-color .2s, background .2s, color .2s;
      white-space: nowrap;
    }
    .day-pill:hover { border-color: var(--accent); color: var(--accent); }
    .day-pill.selected { background: var(--accent); border-color: var(--accent); color: #1a1000; }
    .day-pill.disabled { opacity: .4; cursor: not-allowed; }

    .booking-success-modal .modal-body { padding: 32px 24px !important; }
    .booking-success-modal .booking-summary { overflow: hidden; }
    .booking-success-modal .booking-summary .info-row__value {
      min-width: 0;
      overflow-wrap: anywhere;
      text-align: right;
    }

    @media (max-width: 575px) {
      .booking-success-modal { padding: 0 8px; }
      .booking-success-modal .modal-dialog { margin: 12px auto; }
      .booking-success-modal .modal-content { border-radius: var(--r-lg) !important; }
      .booking-success-modal .modal-body { padding: 24px 16px !important; }
      .booking-success-modal .modal-title { font-size: 1.45rem; }
      .booking-success-modal .booking-summary .info-row {
        align-items: flex-start;
        gap: 8px;
        padding: 11px 12px !important;
      }
      .booking-success-modal .booking-summary .info-row__label {
        flex: 0 0 40%;
        font-size: .68rem;
      }
      .booking-success-modal .booking-summary .info-row__value {
        max-width: 60%;
        font-size: .78rem;
      }
      .booking-success-modal .modal-action {
        min-height: 46px;
        padding: 11px 12px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Mobile Header -->
  <header id="mobile-header" class="mobile-header d-md-none"></header>
  <!-- Desktop Navbar -->
  <div id="desktop-nav" class="d-none d-md-block"></div>

  <main class="page-container fade-up">

    <div class="page-hero">
      <h1 class="page-hero__title">Agendar tu Cita</h1>
      <p class="page-hero__sub">Elige barbero, fecha y horario disponible.</p>
    </div>

    <!-- Service Banner -->
    <div class="service-info-banner mb-3" id="svc-banner">
      <div class="service-info-banner__icon g1" style="overflow:hidden; width:56px; height:56px;">
        <img id="svc-img" src="/img/default-service.svg" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null;this.src='/img/default-service.svg';">
      </div>
      <div>
        <div class="service-info-banner__title" id="svc-title">Cargando servicio...</div>
        <div class="service-info-banner__meta">
          <span class="service-info-banner__price" id="svc-price">$0.00</span>
          <span class="service-info-banner__dur" id="svc-dur">
            <i class="fa fa-clock-o mr-1"></i>0 min
          </span>
        </div>
      </div>
      <a href="/servicios" class="ml-auto btn-ghost" style="padding:7px 12px; font-size:.8rem; white-space:nowrap;">
        <i class="fa fa-pencil"></i> Cambiar
      </a>
    </div>

    <!-- Alert Box -->
    <div class="cc-alert mb-3" id="booking-alert"></div>

    <!-- Card: Barbero (Ahora incluye fechas y horas) -->
    <div class="mb-3">
        <div id="barber-schedules"></div>
    </div>

    <!-- Confirm Button -->
    <button id="btn-confirm-booking" class="btn-accent w-100 mt-2" style="justify-content:center; padding:14px;" onclick="confirmBooking()">
      <i class="fa fa-check-circle"></i> Confirmar Reserva
    </button>

  </main>

  <nav id="bottom-nav" class="bottom-nav d-md-none"></nav>

  <!-- Success Modal -->
  <div class="modal fade booking-success-modal" id="successModal" tabindex="-1" data-backdrop="static" aria-labelledby="successModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center">
        <div class="modal-body" style="padding:32px 24px;">
          <div style="font-size:3.5rem; margin-bottom:12px;"><i class="fa fa-check-circle"></i></div>
          <h2 class="modal-title mb-2" id="successModalTitle">¡Cita Agendada!</h2>
          <p style="color:var(--text-2); font-size:.88rem; margin-bottom:16px;">
            Tu reserva fue registrada con éxito en el sistema.
          </p>

          <div class="info-card booking-summary text-left mb-3" style="background:var(--surface-s); font-size:.85rem;">
            <div class="info-row" style="padding:10px 14px;">
              <span class="info-row__label"><i class="fa fa-scissors"></i> Servicio</span>
              <span class="info-row__value" id="res-service-name">—</span>
            </div>
            <div class="info-row" style="padding:10px 14px;">
              <span class="info-row__label"><i class="fa fa-person-badge"></i> Barbero</span>
              <span class="info-row__value" id="res-barber-name">—</span>
            </div>
            <div class="info-row" style="padding:10px 14px;">
              <span class="info-row__label"><i class="fa fa-calendar"></i> Fecha y Hora</span>
              <span class="info-row__value" id="res-datetime">—</span>
            </div>
            <div class="info-row" style="padding:10px 14px;">
              <span class="info-row__label"><i class="fa fa-tag"></i> Total</span>
              <span class="info-row__value" id="res-total" style="color:var(--accent); font-weight:700;">$0.00</span>
            </div>
          </div>

          <a id="btn-whatsapp" href="#" target="_blank" rel="noopener" class="btn-outline-a modal-action w-100 mb-2" style="justify-content:center; padding:10px; font-size:.85rem;">
            <i class="fa fa-whatsapp"></i> Recordatorio por WhatsApp
          </a>

          <a href="/mis-citas" class="btn-accent modal-action w-100" style="justify-content:center;">
            <i class="fa fa-calendar-check-o"></i> Ver Mis Citas
          </a>
        </div>
      </div>
    </div>
  </div>


  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/site.js"></script>
  <script>
    CC.requireAuth([2]);

    let selectedService = null;
    let selectedBarberId = null;
    let selectedDate = '';
    let selectedTime = '';
    const barberDates = {};

    document.addEventListener('DOMContentLoaded', async () => {
      await loadServiceInfo();
      await loadBarbers();
    });

    function formatDollars(val) {
      return `$${(parseFloat(val) || 0).toFixed(2)}`;
    }

    async function loadServiceInfo() {
      const params = new URLSearchParams(window.location.search);
      const svcId = params.get('id');

      try {
        let res;
        if (svcId) {
          res = await fetch(`/api/servicios/${svcId}`);
        } else {
          res = await fetch('/api/servicios');
        }
        const data = await res.json();

        if (data.ok) {
          if (svcId && data.servicio) {
            selectedService = data.servicio;
          } else if (Array.isArray(data.servicios) && data.servicios.length > 0) {
            selectedService = data.servicios[0];
          }
        }

        if (selectedService) {
          document.getElementById('svc-title').textContent = selectedService.nombre;
          document.getElementById('svc-price').textContent = formatDollars(selectedService.precio);
          document.getElementById('svc-dur').innerHTML = `<i class="fa fa-clock-o mr-1"></i>${selectedService.duracion_minutos} min`;
          
          if (selectedService.imagen) {
            document.getElementById('svc-img').src = selectedService.imagen;
          }
        } else {
          window.location.href = '/servicios';
        }
      } catch (err) {
        console.error('Error al cargar servicio:', err);
      }
    }

    async function loadBarbers() {
      try {
        const res = await fetch('/api/barberos');
        const data = await res.json();

        const container = document.getElementById('barber-schedules');
        container.innerHTML = '';

        const formatHorarios = (horarios) => {
          if (!horarios || !horarios.length) return 'Sin horario asignado';
          const dayNames = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
          const groups = {};
          horarios.forEach(h => {
            const timeStr = `${h.hora_inicio.slice(0,5)} a ${h.hora_fin.slice(0,5)}`;
            if (!groups[timeStr]) groups[timeStr] = [];
            groups[timeStr].push(h.dia_semana);
          });
          let text = [];
          for (const [time, days] of Object.entries(groups)) {
            const dNames = days.map(d => dayNames[d-1]).join(', ');
            text.push(`${dNames}: ${time}`);
          }
          return text.join(' | ');
        };

        if (data.ok && Array.isArray(data.barberos)) {
          data.barberos.forEach((b, index) => {
            const card = document.createElement('div');
            card.className = 'booking-card mb-3 barber-card';
            card.innerHTML = `
              <div class="barber-header" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div class="booking-card__title" style="margin-bottom:2px;"><i class="fa fa-user"></i> ${escapeHtml(b.nombre)}</div>
                  <div class="barber-opt__spec" style="margin-bottom:8px; color:var(--text-2); font-size:0.85rem;">${escapeHtml(b.especialidad || 'Especialista en barbería')}</div>
                  <div style="font-size:0.75rem; color:var(--text-3); margin-bottom:0;">
                    <i class="fa fa-clock-o mr-1"></i> ${escapeHtml(formatHorarios(b.horarios))}
                  </div>
                </div>
                <div class="toggle-icon" style="color:var(--text-2); font-size: 1.2rem; transition: transform 0.3s;">
                  <i class="fa fa-chevron-down"></i>
                </div>
              </div>
              
              <div class="barber-body" style="display: none; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px;">
                <p style="font-size:.78rem; color:var(--text-3); margin-bottom:8px;">Fechas disponibles:</p>
                <div class="d-flex flex-wrap day-pills-container" style="gap:8px; margin-bottom:14px;"></div>
                <div class="cc-group mb-3">
                  <input type="date" class="cc-input custom-date-input">
                </div>

                <p style="font-size:.78rem; color:var(--text-3); margin-bottom:4px;">Horarios disponibles:</p>
                <p style="font-size:.75rem; color:var(--text-3); margin-bottom:10px;">
                  <i class="fa fa-circle mr-1" style="color:var(--accent); font-size:.5rem"></i>Disponible
                  <i class="fa fa-circle mr-1 ml-3" style="color:var(--text-3); font-size:.5rem"></i>Ocupado / Pasado
                </p>
                <div class="slots-container d-none"></div>
              </div>
            `;
            container.appendChild(card);
            
            const header = card.querySelector('.barber-header');
            const body = card.querySelector('.barber-body');
            const icon = card.querySelector('.toggle-icon i');

            header.addEventListener('click', () => {
              const isHidden = body.style.display === 'none';
              document.querySelectorAll('.barber-body').forEach(b => b.style.display = 'none');
              document.querySelectorAll('.toggle-icon i').forEach(i => i.className = 'fa fa-chevron-down');
              
              if (isHidden) {
                body.style.display = 'block';
                icon.className = 'fa fa-chevron-up';
              }
            });

            if (index === 0) {
              body.style.display = 'block';
              icon.className = 'fa fa-chevron-up';
            }
            
            setupDateRangeForBarber(b.id, card, b.horarios);

            fetchBarberAvailability(b.id, card);
          });
        }
      } catch (err) {
        console.error('Error al cargar barberos:', err);
      }
    }

    function formatLocalDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function setupDateRangeForBarber(barberId, cardEl, horarios) {
      const today = new Date();
      const todayStr = formatLocalDate(today);
      
      const customDateEl = cardEl.querySelector('.custom-date-input');
      customDateEl.min = todayStr;

      const pillsContainer = cardEl.querySelector('.day-pills-container');
      pillsContainer.innerHTML = '';

      const dayNamesDb = { 1:'Lunes', 2:'Martes', 3:'Miércoles', 4:'Jueves', 5:'Viernes', 6:'Sábado', 7:'Domingo' };
      
      const workingDays = [];
      if (horarios && horarios.length) {
        horarios.forEach(h => {
          if (!workingDays.includes(h.dia_semana)) workingDays.push(h.dia_semana);
        });
      }
      workingDays.sort();

      const currentJsDay = today.getDay();
      const distanceToMonday = currentJsDay === 0 ? -6 : 1 - currentJsDay;
      const mondayDate = new Date(today);
      mondayDate.setDate(today.getDate() + distanceToMonday);

      let firstValidDateStr = null;

        workingDays.forEach(dbDay => {
          const d = new Date(mondayDate);
          d.setDate(mondayDate.getDate() + (dbDay - 1));
          const dStr = formatLocalDate(d);

          const pill = document.createElement('span');
          pill.className = `day-pill`;
          
          if (dStr < todayStr) {
            pill.classList.add('disabled');
          } else if (!firstValidDateStr) {
            firstValidDateStr = dStr;
            pill.classList.add('selected');
          }
          
          pill.dataset.date = dStr;
          pill.textContent = dayNamesDb[dbDay];
          
          pill.addEventListener('click', () => {
            if (pill.classList.contains('disabled')) return;
            cardEl.querySelectorAll('.day-pill').forEach(p => p.classList.remove('selected'));
            pill.classList.add('selected');
            customDateEl.value = dStr;
            barberDates[barberId] = dStr;
            fetchBarberAvailability(barberId, cardEl);
          });

          pillsContainer.appendChild(pill);
        });

      const defaultDate = firstValidDateStr || todayStr;
      customDateEl.value = defaultDate;
      barberDates[barberId] = defaultDate;

      customDateEl.addEventListener('change', function () {
        if (this.value < todayStr) {
          this.value = todayStr;
        }
        barberDates[barberId] = this.value;

        cardEl.querySelectorAll('.day-pill').forEach(p => {
          p.classList.toggle('selected', p.dataset.date === this.value);
        });

        fetchBarberAvailability(barberId, cardEl);
      });
    }

    async function fetchBarberAvailability(barberId, cardEl) {
      if (!selectedService) return;
      const bDate = barberDates[barberId];
      if (!bDate) return;
      
      try {
        const url = `/api/citas/disponibilidad?barbero_id=${barberId}&fecha=${bDate}&servicio_id=${selectedService.id}`;
        const res = await fetch(url);
        const data = await res.json();
        
        // No extra pill logic needed here, it is handled on card load
        
        const containerEl = cardEl.querySelector('.slots-container');
        containerEl.innerHTML = '';
        if (Array.isArray(data.slots) && data.slots.length > 0) {
          let availableCount = 0;
          data.slots.forEach(s => {
            const slotEl = document.createElement('span');
            slotEl.className = `time-slot ${s.disponible ? '' : 'disabled'}`;
            slotEl.textContent = s.hora;
            if (s.disponible) {
              availableCount++;
              slotEl.addEventListener('click', () => {
                document.querySelectorAll('.time-slot.selected').forEach(t => t.classList.remove('selected'));
                slotEl.classList.add('selected');
                selectedBarberId = barberId;
                selectedDate = bDate;
                selectedTime = s.hora;
                CC.hideAlert('booking-alert');
              });
            }
            containerEl.appendChild(slotEl);
          });
          containerEl.classList.remove('d-none');
        } else {
          containerEl.innerHTML = '<div style="color:var(--text-3); font-size:.85rem; padding: 10px 0;">No hay horarios disponibles.</div>';
          containerEl.classList.remove('d-none');
        }
      } catch (err) {
        console.error('Error al obtener disponibilidad:', err);
      }
    }

    async function confirmBooking() {
      if (!selectedTime || !selectedBarberId) {
        return CC.showAlert('booking-alert', 'Por favor selecciona un horario disponible de algún barbero.', 'err');
      }

      CC.hideAlert('booking-alert');
      CC.setLoading('btn-confirm-booking', true);

      try {
        const token = CC.getToken();
        const res = await fetch('/api/citas', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            servicio_id: selectedService.id,
            barbero_id: selectedBarberId,
            fecha: selectedDate,
            hora: selectedTime
          })
        });

        const data = await res.json();

        if (data.ok) {
          document.getElementById('res-service-name').textContent = data.cita.servicioNombre;
          document.getElementById('res-barber-name').textContent  = data.cita.barberoNombre;
          document.getElementById('res-datetime').textContent    = `${data.cita.fecha} · ${data.cita.hora} hs`;
          document.getElementById('res-total').textContent       = formatDollars(data.cita.servicioPrecio);

          const waMessage = `Hola CortaClic! Confirmación de mi cita:\n Servicio: ${data.cita.servicioNombre}\n Barbero: ${data.cita.barberoNombre}\n Fecha: ${data.cita.fecha}\n Hora: ${data.cita.hora} hs\n Total: ${formatDollars(data.cita.servicioPrecio)}`;
          document.getElementById('btn-whatsapp').href = `https://wa.me/?text=${encodeURIComponent(waMessage)}`;

          $('#successModal').modal('show');
        } else {
          CC.showAlert('booking-alert', data.message || 'No se pudo agendar la cita. Intenta con otro horario.', 'err');
        }
      } catch (err) {
        console.error('Error al agendar cita:', err);
        CC.showAlert('booking-alert', 'Error de conexión. Intenta de nuevo.', 'err');
      } finally {
        CC.setLoading('btn-confirm-booking', false, '<i class="fa fa-check-circle"></i> Confirmar Reserva');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
