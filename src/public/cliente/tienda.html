<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compra productos de barbería premium en CortaClic.">
  <title>Tienda – CortaClic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>

  <header id="mobile-header" class="mobile-header d-md-none"></header>
  <div id="desktop-nav" class="d-none d-md-block"></div>

  <main class="page-container fade-up">

    <div class="page-hero">
      <h1 class="page-hero__title">Productos</h1>
      <p class="page-hero__sub">Lleva la barbería a casa con nuestros productos.</p>
    </div>

    <div class="search-bar">
      <i class="fa fa-search si"></i>
      <input type="text" id="search-prod" placeholder="Buscar producto...">
    </div>

    <div class="pills-row" id="prod-pills">
      <span class="pill active" data-cat="Todos">Todos</span>
      <span class="pill" data-cat="Pomadas">Pomadas</span>
      <span class="pill" data-cat="Barba">Barba</span>
      <span class="pill" data-cat="Shampoo">Shampoo</span>
      <span class="pill" data-cat="Accesorios">Accesorios</span>
    </div>

    <div class="row" id="prod-list" style="margin: 0 -6px;">

      <!-- Generado dinámicamente -->

    </div>

    <div class="empty-state d-none" id="empty-prod">
      <i class="fa fa-times-circle d-block"></i>
      <h3>Sin productos</h3>
      <p>No encontramos productos con ese filtro.</p>
    </div>

  </main>

  <nav id="bottom-nav" class="bottom-nav d-md-none"></nav>

  <!-- Product Modal -->
  <div class="modal fade" id="prodModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="close" data-dismiss="modal"><i class="fa fa-times"></i></button>
        </div>
        <div class="modal-body pt-0">
          <div id="prod-modal-img" class="modal-img g2"><i class="fa fa-shopping-bag"></i></div>
          <div class="d-flex align-items-center justify-content-between flex-wrap mb-1">
            <h2 class="modal-title" id="prod-modal-name">—</h2>
            <span id="prod-modal-cat-badge"
                  style="font-size:.72rem; font-weight:700; padding:4px 12px; border-radius:999px;
                         background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.3); color:#F59E0B;">
              —
            </span>
          </div>
          <div class="modal-price mb-1" id="prod-modal-price">—</div>
          <div class="modal-meta mb-2">
            <div class="modal-meta-item">
              <i class="fa fa-archive"></i>
              <span id="prod-modal-stock">— en stock</span>
            </div>
          </div>
          <p class="modal-desc" id="prod-modal-desc">—</p>
        </div>
        <div class="modal-footer">
          <button class="btn-ghost mr-2" data-dismiss="modal">Cerrar</button>
          <button id="btn-add-cart" class="btn-accent" onclick="handleAddCart()">
            <i class="fa fa-cart-plus"></i> Agregar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/site.js"></script>
  <script>
    let productosData = [];
    let selectedProduct = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadProductos();
      renderProductos();
      setupFilters();
    });

    async function loadProductos() {
      try {
        const res = await fetch('/api/productos');
        const data = await res.json();
        if (data.ok) {
          productosData = data.productos;
        }
      } catch (err) {
        console.error('Error cargando productos:', err);
      }
    }

    function renderProductos() {
      const list = document.getElementById('prod-list');
      list.innerHTML = '';
      
      if (productosData.length === 0) {
        document.getElementById('empty-prod').classList.remove('d-none');
        document.getElementById('empty-prod').innerHTML = `
          <i class="fa fa-times-circle d-block"></i>
          <h3>Sin productos</h3>
          <p>Actualmente no hay productos disponibles en la tienda.</p>
        `;
        return;
      }

      const q = document.getElementById('search-prod').value.toLowerCase();
      const cat = document.querySelector('#prod-pills .pill.active')?.dataset.cat || 'Todos';
      
      let visible = 0;
      productosData.forEach(p => {
        const matchCat = cat === 'Todos' || p.categoria === cat;
        const matchName = p.nombre.toLowerCase().includes(q);
        
        if (matchCat && matchName) {
          visible++;
          const priceStr = parseFloat(p.precio).toFixed(2);
          
          // Generar gradiente aleatorio/determinado
          const grad = 'g' + ((p.id % 6) + 1);
          // Si tiene imagen usala, si no, un emoji
          let imgHtml = '';
          if (p.imagen && p.imagen.startsWith('http')) {
            imgHtml = `<div class="product-card__img" style="background-image:url('${p.imagen}'); background-size:cover; background-position:center;"></div>`;
          } else {
            const emoji = p.imagen || '🧴';
            imgHtml = `<div class="product-card__img ${grad}">${emoji}</div>`;
          }

          const col = document.createElement('div');
          col.className = 'col-6 col-md-3 mb-3 px-2';
          col.innerHTML = `
            <div class="product-card">
              ${imgHtml}
              <div class="product-card__body">
                <div class="product-card__cat">${p.categoria}</div>
                <div class="product-card__name">${p.nombre}</div>
                <div class="product-card__price">$${priceStr}</div>
              </div>
            </div>
          `;
          
          col.querySelector('.product-card').addEventListener('click', () => {
            selectedProduct = p;
            openModal(p, grad);
          });
          
          list.appendChild(col);
        }
      });
      
      document.getElementById('empty-prod').classList.toggle('d-none', visible > 0);
    }

    function openModal(p, grad) {
      const img = document.getElementById('prod-modal-img');
      if (p.imagen && p.imagen.startsWith('http')) {
        img.className = 'modal-img';
        img.style.backgroundImage = `url('${p.imagen}')`;
        img.style.backgroundSize = 'cover';
        img.textContent = '';
      } else {
        img.className = 'modal-img ' + grad;
        img.style.backgroundImage = 'none';
        img.textContent = p.imagen || '🧴';
      }
      
      document.getElementById('prod-modal-name').textContent = p.nombre;
      document.getElementById('prod-modal-price').textContent = '$' + parseFloat(p.precio).toFixed(2);
      document.getElementById('prod-modal-cat-badge').textContent = p.categoria;
      document.getElementById('prod-modal-stock').textContent = p.stock + ' en stock';
      document.getElementById('prod-modal-desc').textContent = p.descripcion || 'Sin descripción detallada.';
      
      $('#prodModal').modal('show');
    }

    function handleAddCart() {
      if (!CC.isLoggedIn()) {
        window.location.href = '/login';
        return;
      }
      if (!selectedProduct) return;
      
      let cart = JSON.parse(localStorage.getItem('cc_cart') || '[]');
      const exist = cart.find(x => x.id === selectedProduct.id);
      if (exist) {
        if (exist.cantidad < selectedProduct.stock) {
           exist.cantidad++;
        } else {
           alert('No hay más stock disponible de este producto.');
           return;
        }
      } else {
        cart.push({
          id: selectedProduct.id,
          nombre: selectedProduct.nombre,
          precio: selectedProduct.precio,
          imagen: selectedProduct.imagen,
          cantidad: 1,
          stock: selectedProduct.stock
        });
      }
      
      localStorage.setItem('cc_cart', JSON.stringify(cart));
      $('#prodModal').modal('hide');
      
      // Mostrar feedback
      const btn = document.createElement('div');
      btn.innerHTML = `<div style="position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:10px 20px; border-radius:30px; z-index:9999; box-shadow:0 4px 15px rgba(245,158,11,0.4); font-weight:600; display:flex; align-items:center; gap:8px;">
        <i class="fa fa-check-circle"></i> Agregado al carrito
      </div>`;
      document.body.appendChild(btn);
      setTimeout(() => btn.remove(), 2500);
    }

    function setupFilters() {
      document.querySelectorAll('#prod-pills .pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('#prod-pills .pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          renderProductos();
        });
      });
      document.getElementById('search-prod').addEventListener('input', renderProductos);
    }
  </script>
</body>
</html>
