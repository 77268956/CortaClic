<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulta y gestiona todas tus citas en CortaClic.">
  <title>Mis Citas – CortaClic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>

  <!-- Mobile Header -->
  <header id="mobile-header" class="mobile-header d-md-none"></header>
  <!-- Desktop Navbar -->
  <div id="desktop-nav" class="d-none d-md-block"></div>

  <main class="page-container fade-up">

    <!-- Hero -->
    <div class="page-hero">
      <h1 class="page-hero__title">Historial</h1>
      <p class="page-hero__sub">Gestiona tus reservas y citas agendadas.</p>
    </div>

    <!-- Filter Pills -->
    <div class="pills-row mb-3" id="filter-pills">
      <span class="pill active" data-filter="all">Todas</span>
      <span class="pill" data-filter="proximas">Próximas</span>
      <span class="pill" data-filter="completadas">Completadas</span>
      <span class="pill" data-filter="canceladas">Canceladas</span>
    </div>

    <!-- Alert Box -->
    <div class="cc-alert mb-3" id="citas-alert"></div>

    <!-- Loading State -->
    <div id="loading-citas" class="text-center py-5">
      <span class="btn-spinner mb-2" style="width:28px; height:28px; border-width:3px;"></span>
      <p style="font-size:.88rem; color:var(--text-3);">Cargando tus citas...</p>
    </div>

    <!-- Citas List -->
    <div id="citas-list" style="display:none;"></div>

    <!-- Empty State -->
    <div class="empty-state d-none" id="empty-state">
      <i class="fa fa-calendar-x d-block"></i>
      <h3 id="empty-title">Sin citas por aquí</h3>
      <p id="empty-sub">No tienes citas agendadas en esta sección.</p>
      <a href="/servicios" class="btn-accent mt-2">
        <i class="fa fa-plus-circle"></i> Agendar mi primera cita
      </a>
    </div>

  </main>

  <!-- Bottom Nav (Mobile) -->
  <nav id="bottom-nav" class="bottom-nav d-md-none"></nav>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/site.js"></script>
  <script>
    CC.requireAuth([2]);

    let userCitas = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', loadUserAppointments);

    function formatDollars(val) {
      return `$${(parseFloat(val) || 0).toFixed(2)}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadUserAppointments() {
      const loader = document.getElementById('loading-citas');
      const listEl = document.getElementById('citas-list');
      const emptyEl = document.getElementById('empty-state');

      try {
        const token = CC.getToken();
        const res = await fetch('/api/citas/mis-citas', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();

        loader.style.display = 'none';

        if (data.ok && Array.isArray(data.citas) && data.citas.length > 0) {
          userCitas = data.citas;
          renderCitasList();
        } else {
          listEl.style.display = 'none';
          emptyEl.classList.remove('d-none');
        }
      } catch (err) {
        console.error('Error al cargar citas:', err);
        loader.style.display = 'none';
        emptyEl.classList.remove('d-none');
      }
    }

    function renderCitasList() {
      const listEl = document.getElementById('citas-list');
      const emptyEl = document.getElementById('empty-state');
      listEl.innerHTML = '';

      const filtered = userCitas.filter(c => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'proximas') return c.estado === 0 || c.estado === 1;
        if (currentFilter === 'completadas') return c.estado === 3;
        if (currentFilter === 'canceladas') return c.estado === 2;
        return true;
      });

      if (filtered.length === 0) {
        listEl.style.display = 'none';
        emptyEl.classList.remove('d-none');
        return;
      }

      emptyEl.classList.add('d-none');
      listEl.style.display = 'block';

      filtered.forEach(c => {
        const dt = new Date(c.fecha_hora);
        const fechaFormatted = dt.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
        const horaFormatted = dt.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

        let badgeHtml = '';
        let statusGroup = 'proximas';

        if (c.estado === 0) {
          badgeHtml = '<span class="sbadge sbadge-pending">Pendiente</span>';
        } else if (c.estado === 1) {
          badgeHtml = '<span class="sbadge sbadge-confirm">Confirmada</span>';
        } else if (c.estado === 2) {
          badgeHtml = '<span class="sbadge sbadge-cancel">Cancelada</span>';
          statusGroup = 'canceladas';
        } else if (c.estado === 3) {
          badgeHtml = '<span class="sbadge sbadge-done">Completada</span>';
          statusGroup = 'completadas';
        }

        const canCancel = (c.estado === 0 || c.estado === 1);

        const card = document.createElement('div');
        card.className = 'cita-card';
        card.dataset.status = statusGroup;

        card.innerHTML = `
          <div class="cita-card__top">
            <div class="cita-card__service">${escapeHtml(c.servicio_nombre)}</div>
            ${badgeHtml}
          </div>
          <div class="cita-card__details">
            <div class="cita-card__detail"><i class="fa fa-person-badge"></i> ${escapeHtml(c.barbero_nombre)}</div>
            <div class="cita-card__detail"><i class="fa fa-calendar"></i> ${fechaFormatted}</div>
            <div class="cita-card__detail"><i class="fa fa-clock-o"></i> ${horaFormatted}</div>
            <div class="cita-card__detail"><i class="fa fa-tag"></i> ${formatDollars(c.servicio_precio)}</div>
          </div>
          <div class="cita-card__footer">
            ${canCancel ? `
              <button class="btn-danger-ghost mr-2" onclick="cancelAppointment(${c.id})">
                <i class="fa fa-x-circle mr-1"></i>Cancelar Cita
              </button>
            ` : ''}
          </div>
        `;

        listEl.appendChild(card);
      });
    }

    async function cancelAppointment(citaId) {
      const result = await Swal.fire({
        title: '¿Cancelar cita?',
        text: 'Esta acción no se puede deshacer.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#EF4444',
        cancelButtonColor: '#6b7280',
        confirmButtonText: 'Sí, cancelar',
        cancelButtonText: 'No, mantener',
        background: '#131b27',
        color: '#F9FAFB'
      });
      if (!result.isConfirmed) return;

      try {
        const token = CC.getToken();
        const res = await fetch(`/api/citas/${citaId}/cancelar`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();

        if (data.ok) {
          CC.showAlert('citas-alert', 'Cita cancelada exitosamente.', 'ok');
          loadUserAppointments();
        } else {
          CC.showAlert('citas-alert', data.message || 'No se pudo cancelar la cita.', 'err');
        }
      } catch (err) {
        console.error('Error al cancelar cita:', err);
        CC.showAlert('citas-alert', 'Error de conexión. Intenta de nuevo.', 'err');
      }
    }

    document.querySelectorAll('#filter-pills .pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('#filter-pills .pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        renderCitasList();
      });
    });
  </script>
</body>
</html>
