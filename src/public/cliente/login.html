<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión o crea tu cuenta en CortaClic para agendar citas y comprar productos.">
  <title>Iniciar Sesión – CortaClic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px;
      background: #fff;
      color: #3c4043;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: .9rem;
      border: 1.5px solid #dadce0;
      border-radius: var(--r-full);
      cursor: pointer;
      transition: background .2s, box-shadow .2s;
      text-decoration: none;
    }
    .btn-google:hover {
      background: #f8f9fa;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      color: #3c4043;
      text-decoration: none;
    }
    .btn-google svg { flex-shrink: 0; }
  </style>
</head>
<body class="auth-body">

  <div class="auth-wrap">
    <div class="auth-card fade-up">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo__icon">✂️</div>
        <h1>Corta<span class="acc">Clic</span></h1>
        <p>Tu barbería digital</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs" id="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Iniciar Sesión</div>
        <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Registrarse</div>
      </div>

      <!-- ── LOGIN FORM ── -->
      <div id="form-login">
        <div class="cc-alert" id="alert-login"></div>

        <div class="cc-group">
          <label class="cc-label">Email</label>
          <div class="cc-input-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" id="login-email" class="cc-input" placeholder="tu@email.com" autocomplete="email">
          </div>
        </div>

        <div class="cc-group">
          <label class="cc-label">Contraseña</label>
          <div class="cc-input-icon">
            <i class="bi bi-lock"></i>
            <input type="password" id="login-pass" class="cc-input" placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>

        <button id="btn-login" class="btn-accent w-100 mt-2" style="justify-content:center;" onclick="doLogin()">
          <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
        </button>

        <div class="divider-text mt-3">o continúa con</div>

        <a href="/api/auth/google" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
            <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
            <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18z"/>
            <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/>
          </svg>
          Continuar con Google
        </a>

        <p class="text-center mt-3" style="font-size:.83rem; color:var(--text-3);">
          ¿No tienes cuenta?
          <span onclick="switchTab('register')" style="color:var(--accent); cursor:pointer; font-weight:600;">Regístrate</span>
        </p>
      </div>

      <!-- ── REGISTER FORM ── -->
      <div id="form-register" style="display:none;">
        <div class="cc-alert" id="alert-register"></div>

        <div class="cc-group">
          <label class="cc-label">Nombre completo</label>
          <div class="cc-input-icon">
            <i class="bi bi-person"></i>
            <input type="text" id="reg-nombre" class="cc-input" placeholder="Tu nombre" autocomplete="name">
          </div>
        </div>

        <div class="cc-group">
          <label class="cc-label">Email</label>
          <div class="cc-input-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" id="reg-email" class="cc-input" placeholder="tu@email.com" autocomplete="email">
          </div>
        </div>

        <div class="cc-group">
          <label class="cc-label">Teléfono <span style="color:var(--text-3); font-size:.7rem; text-transform:none; letter-spacing:0;">(opcional)</span></label>
          <div class="cc-input-icon">
            <i class="bi bi-phone"></i>
            <input type="tel" id="reg-tel" class="cc-input" placeholder="+52 55 0000 0000" autocomplete="tel">
          </div>
        </div>

        <div class="cc-group">
          <label class="cc-label">Contraseña</label>
          <div class="cc-input-icon">
            <i class="bi bi-lock"></i>
            <input type="password" id="reg-pass" class="cc-input" placeholder="Mín. 6 caracteres" autocomplete="new-password">
          </div>
        </div>

        <button id="btn-register" class="btn-accent w-100 mt-2" style="justify-content:center;" onclick="doRegister()">
          <i class="bi bi-person-plus"></i> Crear Cuenta
        </button>

        <div class="divider-text mt-3">o continúa con</div>

        <a href="/api/auth/google" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
            <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
            <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18z"/>
            <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/>
          </svg>
          Continuar con Google
        </a>

        <p class="text-center mt-3" style="font-size:.83rem; color:var(--text-3);">
          ¿Ya tienes cuenta?
          <span onclick="switchTab('login')" style="color:var(--accent); cursor:pointer; font-weight:600;">Inicia sesión</span>
        </p>
      </div>

    </div><!-- /auth-card -->

    <!-- Back to home -->
    <p class="text-center mt-3" style="font-size:.8rem;">
      <a href="/" style="color:var(--text-3);">
        <i class="bi bi-arrow-left mr-1"></i>Volver al inicio
      </a>
    </p>

  </div><!-- /auth-wrap -->

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/site.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CC.redirectIfLoggedIn('/');
      if (window.location.hash === '#registro') switchTab('register');
    });

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('form-login').style.display    = isLogin ? '' : 'none';
      document.getElementById('form-register').style.display = isLogin ? 'none' : '';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      CC.hideAlert('alert-login');
      CC.hideAlert('alert-register');
    }

    async function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;

      if (!email || !pass) {
        return CC.showAlert('alert-login', 'Por favor completa todos los campos.', 'err');
      }

      CC.hideAlert('alert-login');
      CC.setLoading('btn-login', true);

      try {
        const data = await CC.apiLogin(email, pass);
        if (data.ok) {
          CC.saveSession(data.token, data.user);
          const params = new URLSearchParams(window.location.search);
          const target = data.user.rol === 0 ? '/admin/dashboard' : (params.get('next') || '/');
          window.location.href = target;
        } else {
          CC.showAlert('alert-login', data.message || 'Credenciales incorrectas.', 'err');
        }
      } catch {
        CC.showAlert('alert-login', 'Error de conexión. Intenta de nuevo.', 'err');
      } finally {
        CC.setLoading('btn-login', false, '<i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión');
      }
    }

    async function doRegister() {
      const nombre = document.getElementById('reg-nombre').value.trim();
      const email  = document.getElementById('reg-email').value.trim();
      const tel    = document.getElementById('reg-tel').value.trim();
      const pass   = document.getElementById('reg-pass').value;

      if (!nombre || !email || !pass) {
        return CC.showAlert('alert-register', 'Nombre, email y contraseña son requeridos.', 'err');
      }
      if (pass.length < 6) {
        return CC.showAlert('alert-register', 'La contraseña debe tener al menos 6 caracteres.', 'err');
      }

      CC.hideAlert('alert-register');
      CC.setLoading('btn-register', true);

      try {
        const data = await CC.apiRegister(nombre, email, tel, pass);
        if (data.ok) {
          CC.saveSession(data.token, data.user);
          window.location.href = '/';
        } else {
          CC.showAlert('alert-register', data.message || 'Error al crear la cuenta.', 'err');
        }
      } catch {
        CC.showAlert('alert-register', 'Error de conexión. Intenta de nuevo.', 'err');
      } finally {
        CC.setLoading('btn-register', false, '<i class="bi bi-person-plus"></i> Crear Cuenta');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const loginVisible = document.getElementById('form-login').style.display !== 'none';
      loginVisible ? doLogin() : doRegister();
    });
  </script>
</body>
</html>
