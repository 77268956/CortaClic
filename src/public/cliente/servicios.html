<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explora nuestro menú completo de cortes y servicios de barbería en CortaClic.">
  <title>Menú de Servicios – CortaClic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>

  <!-- Mobile Header -->
  <header id="mobile-header" class="mobile-header d-md-none"></header>
  <!-- Desktop Navbar -->
  <div id="desktop-nav" class="d-none d-md-block"></div>

  <main class="page-container fade-up">

    <!-- Hero -->
    <div class="page-hero text-center text-md-left">
      <h1 class="page-hero__title">Catálogo de Servicios</h1>
      <p class="page-hero__sub">Conoce todos nuestros tratamientos, cortes y precios.</p>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <i class="fa fa-search si"></i>
      <input type="text" id="search-svc" placeholder="Buscar en el catálogo de servicios..." autocomplete="off">
    </div>

    <!-- Section Title -->
    <p class="section-title"><i class="fa fa-scissors mr-2" style="color:var(--accent)"></i>Todos los Servicios</p>

    <!-- Loading State -->
    <div id="loading-services" class="text-center py-5">
      <span class="btn-spinner mb-2" style="width:28px; height:28px; border-width:3px;"></span>
      <p style="font-size:.88rem; color:var(--text-3);">Cargando catálogo...</p>
    </div>

    <!-- Grid Container (2 columns on mobile, 3 on desktop) -->
    <div class="row" id="svc-grid" style="display:none; margin: 0 -6px;"></div>

    <!-- Empty State -->
    <div class="empty-state d-none" id="empty-svc">
      <i class="fa fa-scissors d-block"></i>
      <h3 id="empty-title">Sin resultados</h3>
      <p id="empty-sub">No encontramos ningún servicio que coincida con tu búsqueda.</p>
    </div>

  </main>

  <!-- Bottom Nav -->
  <nav id="bottom-nav" class="bottom-nav d-md-none"></nav>

  <!-- Service Detail Modal -->
  <div class="modal fade" id="svcModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="close" data-dismiss="modal">
            <i class="fa fa-times"></i>
          </button>
        </div>
        <div class="modal-body pt-0">
          <!-- Image -->
          <div class="modal-img mb-3">
            <img id="svc-modal-img-el" src="/img/default-service.svg" alt="Servicio" onerror="this.onerror=null;this.src='/img/default-service.svg';">
          </div>
          <!-- Name -->
          <h2 class="modal-title mb-2" id="svc-modal-name">—</h2>
          <!-- Price in Dollars ($) -->
          <div class="modal-price mb-2" id="svc-modal-price">$0.00</div>
          <!-- Meta -->
          <div class="modal-meta mb-3">
            <div class="modal-meta-item">
              <i class="fa fa-clock-o"></i>
              <span id="svc-modal-dur">— min</span>
            </div>
          </div>
          <!-- Description -->
          <p class="modal-desc" id="svc-modal-desc">—</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost mr-2" data-dismiss="modal">Cerrar</button>
          <a id="svc-btn-agendar" href="#" class="btn-accent">
            <i class="fa fa-calendar-plus"></i> Agendar Cita
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/site.js"></script>
  <script>
    let catalogServices = [];

    function formatDollars(amount) {
      const val = parseFloat(amount) || 0;
      return `$${val.toFixed(2)}`;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadCatalogFromDB() {
      const loader = document.getElementById('loading-services');
      const gridEl = document.getElementById('svc-grid');
      const emptyEl = document.getElementById('empty-svc');

      try {
        const res = await fetch('/api/servicios');
        const data = await res.json();

        loader.style.display = 'none';

        if (data.ok && Array.isArray(data.servicios) && data.servicios.length > 0) {
          catalogServices = data.servicios;
          renderGrid(catalogServices);
          gridEl.style.display = 'flex';
        } else {
          document.getElementById('empty-title').textContent = 'Sin servicios';
          document.getElementById('empty-sub').textContent = 'No hay servicios registrados en la base de datos.';
          emptyEl.classList.remove('d-none');
        }
      } catch (err) {
        console.error('Error al cargar catálogo:', err);
        loader.style.display = 'none';
        document.getElementById('empty-title').textContent = 'Error de conexión';
        document.getElementById('empty-sub').textContent = 'No se pudieron cargar los servicios.';
        emptyEl.classList.remove('d-none');
      }
    }

    function renderGrid(services) {
      const gridEl = document.getElementById('svc-grid');
      gridEl.innerHTML = '';

      services.forEach(s => {
        const imgPath = s.imagen ? s.imagen : '/img/default-service.svg';
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4 mb-3 px-2';

        col.innerHTML = `
          <div class="catalog-card" data-id="${s.id}">
            <div class="catalog-card__img">
              <img src="${escapeHtml(imgPath)}" alt="${escapeHtml(s.nombre)}" onerror="this.onerror=null;this.src='/img/default-service.svg';">
              <span class="catalog-card__badge">
                <i class="fa fa-clock-o"></i> ${s.duracion_minutos}m
              </span>
            </div>
            <div class="catalog-card__body">
              <h3 class="catalog-card__title">${escapeHtml(s.nombre)}</h3>
              <p class="catalog-card__desc">${escapeHtml(s.descripcion || 'Servicio profesional de barbería.')}</p>
              <div class="catalog-card__footer">
                <span class="catalog-card__price">${formatDollars(s.precio)}</span>
              </div>
            </div>
          </div>
        `;

        col.querySelector('.catalog-card').addEventListener('click', () => openCatalogModal(s));
        gridEl.appendChild(col);
      });
    }

    function openCatalogModal(s) {
      const imgPath = s.imagen ? s.imagen : '/img/default-service.svg';
      const imgEl = document.getElementById('svc-modal-img-el');
      imgEl.src = imgPath;
      imgEl.alt = s.nombre;

      document.getElementById('svc-modal-name').textContent = s.nombre;
      document.getElementById('svc-modal-price').textContent = formatDollars(s.precio);
      document.getElementById('svc-modal-dur').textContent = `${s.duracion_minutos} min`;
      document.getElementById('svc-modal-desc').textContent = s.descripcion || 'Sin descripción disponible.';

      const btnAgendar = document.getElementById('svc-btn-agendar');
      btnAgendar.href = CC.isLoggedIn() ? `/servicios/reservar?id=${s.id}` : '/login';

      $('#svcModal').modal('show');
    }

    document.getElementById('search-svc').addEventListener('input', function () {
      const q = this.value.toLowerCase().trim();
      const gridEl = document.getElementById('svc-grid');
      const emptyEl = document.getElementById('empty-svc');

      const filtered = catalogServices.filter(s =>
        s.nombre.toLowerCase().includes(q) ||
        (s.descripcion && s.descripcion.toLowerCase().includes(q))
      );

      if (filtered.length > 0) {
        renderGrid(filtered);
        gridEl.style.display = 'flex';
        emptyEl.classList.add('d-none');
      } else {
        gridEl.style.display = 'none';
        document.getElementById('empty-title').textContent = 'Sin resultados';
        document.getElementById('empty-sub').textContent = 'No encontramos ningún corte que coincida.';
        emptyEl.classList.remove('d-none');
      }
    });

    document.addEventListener('DOMContentLoaded', loadCatalogFromDB);
  </script>
</body>
</html>
